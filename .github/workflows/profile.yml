name: Profile assets

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - '.github/profile-3d.json'
      - 'scripts/**'
      - 'assets/fonts/**'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stats
        run: node scripts/generate-stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_PERSONAL_ACCESS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: 3D contribution graph
        uses: nicomfe/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_PERSONAL_ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Collect 3D output
        run: mv profile-3d-contrib/*.svg dist/

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: 'chore: refresh profile assets'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
