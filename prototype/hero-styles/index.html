<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — hero.gif style options</title>
  <!-- Question: Which visual direction for the GitHub profile hero banner (840×300)? -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #1a1a1a;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 88px;
      gap: 16px;
    }
    .meta {
      color: #888;
      font-size: 13px;
      max-width: 840px;
      width: 100%;
      text-align: center;
    }
    .meta strong { color: #ccc; }
    .stage {
      width: 100%;
      max-width: 840px;
      aspect-ratio: 840 / 300;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    .stage svg, .stage .hero {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* —— Variant B: terminal —— */
    .hero-terminal {
      background: #0d0f0d;
      position: relative;
      font-family: "Geist Mono", ui-monospace, monospace;
      overflow: hidden;
    }
    .hero-terminal::after {
      content: "";
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.12) 2px,
        rgba(0,0,0,.12) 4px
      );
      pointer-events: none;
    }
    .hero-terminal .inner { padding: 48px 56px; position: relative; z-index: 1; }
    .hero-terminal h1 {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 600;
      color: #33ff66;
      text-shadow: 0 0 20px rgba(51,255,102,.35);
      letter-spacing: -0.02em;
    }
    .hero-terminal .prompt { margin-top: 20px; font-size: 18px; color: #2a8f4a; }
    .hero-terminal .typed { color: #b8ffc8; }
    .hero-terminal .tag { margin-top: 28px; font-size: 14px; color: #3d6b4a; }
    .hero-terminal .cursor {
      display: inline-block; width: 10px; height: 1.1em;
      background: #33ff66; vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }

    /* —— Variant C: editorial centered —— */
    .hero-editorial {
      background: linear-gradient(165deg, #fafafa 0%, #eee 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 40px;
      font-family: Georgia, "Times New Roman", serif;
    }
    .hero-editorial h1 {
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 400;
      color: #111;
      letter-spacing: -0.03em;
    }
    .hero-editorial .rule {
      width: 48px; height: 3px; background: #111;
      margin: 16px auto 20px;
    }
    .hero-editorial .roles {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      font-family: system-ui, sans-serif;
    }
    .hero-editorial .roles span {
      font-size: 13px; padding: 6px 14px;
      border: 1px solid #ccc; border-radius: 999px;
      color: #444; background: #fff;
    }
    .hero-editorial .tag {
      margin-top: 22px;
      font-family: system-ui, sans-serif;
      font-size: 15px; color: #666; max-width: 420px;
    }

    /* —— Variant D: split neon —— */
    .hero-split {
      display: grid;
      grid-template-columns: 38% 1fr;
      height: 100%;
      background: #0a0a0f;
    }
    .hero-split .left {
      background: #111118;
      border-right: 1px solid #2a2a38;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .hero-split .left h1 {
      font-size: clamp(22px, 4.5vw, 34px);
      font-weight: 600;
      color: #f5f5f7;
      letter-spacing: -0.04em;
      line-height: 1.15;
    }
    .hero-split .left .tag {
      margin-top: 16px;
      font-size: 13px;
      color: #6b6b80;
      line-height: 1.45;
    }
    .hero-split .right {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 40px;
    }
    .hero-split .mesh {
      position: absolute; inset: -40%;
      background:
        radial-gradient(ellipse 60% 50% at 30% 40%, rgba(120,80,255,.45), transparent),
        radial-gradient(ellipse 50% 60% at 70% 60%, rgba(0,200,255,.35), transparent),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(255,100,180,.2), transparent);
      animation: mesh-drift 12s ease-in-out infinite alternate;
    }
    @keyframes mesh-drift {
      from { transform: translate(0, 0) rotate(0deg); }
      to { transform: translate(-4%, 3%) rotate(3deg); }
    }
    .hero-split .terminal {
      position: relative; z-index: 1;
      font-family: ui-monospace, monospace;
      font-size: 17px;
      color: #e8e8ff;
    }
    .hero-split .terminal .gt { color: #8888aa; }
    .hero-split .cursor {
      display: inline-block; width: 9px; height: 1.05em;
      background: #a78bfa; vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }

    /* —— Variant E: brutalist —— */
    .hero-brutal {
      background: #fff;
      border: 4px solid #000;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }
    .hero-brutal .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .hero-brutal h1 {
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    .hero-brutal .stamp {
      font-size: 10px;
      font-weight: 700;
      border: 2px solid #000;
      padding: 8px 10px;
      flex-shrink: 0;
      text-align: right;
      line-height: 1.2;
      width: fit-content;
      margin-top: 0.02em;
    }
    .hero-brutal .stamp .years {
      display: block;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .hero-brutal .mid {
      font-family: ui-monospace, monospace;
      font-size: 20px;
      font-weight: 600;
      border-top: 3px solid #000;
      border-bottom: 3px solid #000;
      padding: 14px 0;
      margin: 12px 0;
    }
    .hero-brutal .tag {
      font-size: 14px;
      font-weight: 500;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Switcher (not part of hero design) */
    .prototype-switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      color: #111;
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
      font-size: 14px;
      z-index: 9999;
      user-select: none;
    }
    .prototype-switcher button {
      border: none;
      background: #eee;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .prototype-switcher button:hover { background: #ddd; }
    .prototype-switcher .label { min-width: 200px; text-align: center; font-weight: 600; }
    .state-panel {
      max-width: 840px;
      width: 100%;
      background: #252525;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: #9cf;
    }
  </style>
</head>
<body>
  <p class="meta"><strong>PROTOTYPE</strong> — flip variants with ← → or the bar below. Share via <code>?variant=B</code></p>
  <div class="stage" id="stage" aria-live="polite"></div>
  <pre class="state-panel" id="state"></pre>

  <nav class="prototype-switcher" aria-label="Prototype variant switcher">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <span class="label" id="switcher-label"></span>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </nav>

  <script>
    const PHRASES = ["Senior Software Engineer", "Tech Lead", "Startup Builder"];
    const TAGLINE = "Helping startups turn ideas into reality";
    const NAME = "Nicolás Fetter";

    const VARIANTS = [
      { key: "A", name: "Light blueprint (current)" },
      { key: "B", name: "Terminal phosphor" },
      { key: "C", name: "Editorial centered" },
      { key: "D", name: "Split + mesh gradient" },
      { key: "E", name: "Brutalist poster" },
    ];

    let phraseIndex = 0;
    let charIndex = 0;
    let deleting = false;
    let pause = 0;

    function svgA(time, text) {
      const W = 840, H = 300;
      const beamH = -140 + ((time % 7) / 7) * (W + 140);
      const beamV = -120 + ((time % 9) / 9) * (H + 120);
      const cursorOn = (time % 1.1) < 0.55;
      const TEXT_X = 81, CHAR_W = 13, cursorX = TEXT_X + text.length * CHAR_W;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <defs>
          <clipPath id="card"><rect width="${W}" height="${H}" rx="14"/></clipPath>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0H0V24" fill="none" stroke="#f0f0f0" stroke-width="1"/>
          </pattern>
          <radialGradient id="fade" cx="78%" cy="18%" r="78%">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <mask id="grid-mask"><rect width="${W}" height="${H}" fill="url(#fade)"/></mask>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#70c8ff" stop-opacity="0.28"/>
            <stop offset="1" stop-color="#70c8ff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="beam-h" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#70c8ff" stop-opacity="0"/><stop offset="1" stop-color="#70c8ff"/>
          </linearGradient>
          <linearGradient id="beam-v" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#70c8ff" stop-opacity="0"/><stop offset="1" stop-color="#70c8ff"/>
          </linearGradient>
        </defs>
        <rect width="${W}" height="${H}" rx="14" fill="#ffffff"/>
        <g clip-path="url(#card)">
          <rect width="${W}" height="${H}" fill="url(#grid)" mask="url(#grid-mask)"/>
          <circle cx="220" cy="150" r="190" fill="url(#glow)"/>
          <rect x="${beamH.toFixed(2)}" y="48" width="140" height="1.5" fill="url(#beam-h)"/>
          <rect x="798" y="${beamV.toFixed(2)}" width="1.5" height="120" fill="url(#beam-v)"/>
        </g>
        <rect x="0.5" y="0.5" width="839" height="299" rx="14" fill="none" stroke="#e5e5e5"/>
        <text x="56" y="122" fill="#0a0a0a" font-family="system-ui,sans-serif" font-weight="600" font-size="52" letter-spacing="-1.6">${NAME}</text>
        <text x="56" y="174" fill="#a1a1a1" font-family="ui-monospace,monospace" font-size="21">&gt;</text>
        <text x="${TEXT_X}" y="174" fill="#0a0a0a" font-family="ui-monospace,monospace" font-size="21">${text}</text>
        <rect x="${cursorX}" y="155" width="10" height="24" rx="1.5" fill="#70c8ff" opacity="${cursorOn ? 1 : 0}"/>
        <text x="56" y="216" fill="#666666" font-family="system-ui,sans-serif" font-size="16">${TAGLINE}</text>
      </svg>`;
    }

    function currentText() {
      return PHRASES[phraseIndex].slice(0, charIndex);
    }

    function tickTypewriter() {
      const full = PHRASES[phraseIndex];
      if (pause > 0) { pause--; return; }
      if (!deleting) {
        if (charIndex < full.length) charIndex++;
        else { pause = 28; deleting = true; }
      } else {
        if (charIndex > 0) charIndex -= 2;
        else { deleting = false; phraseIndex = (phraseIndex + 1) % PHRASES.length; pause = 5; }
      }
    }

    function renderVariant(key, time) {
      const text = currentText();
      const stage = document.getElementById("stage");
      if (key === "A") {
        stage.innerHTML = svgA(time, text);
        return;
      }
      if (key === "B") {
        stage.innerHTML = `<div class="hero hero-terminal"><div class="inner">
          <h1>${NAME}</h1>
          <p class="prompt"><span class="gt">&gt; </span><span class="typed">${text}</span><span class="cursor"></span></p>
          <p class="tag">${TAGLINE}</p>
        </div></div>`;
        return;
      }
      if (key === "C") {
        stage.innerHTML = `<div class="hero hero-editorial">
          <h1>${NAME}</h1>
          <div class="rule"></div>
          <div class="roles">${PHRASES.map((p, i) => `<span style="opacity:${phraseIndex === i ? 1 : 0.45}">${p}</span>`).join("")}</div>
          <p class="tag">${TAGLINE}</p>
        </div>`;
        return;
      }
      if (key === "D") {
        stage.innerHTML = `<div class="hero hero-split">
          <div class="left"><h1>${NAME}</h1><p class="tag">${TAGLINE}</p></div>
          <div class="right"><div class="mesh"></div>
            <div class="terminal"><span class="gt">&gt; </span>${text}<span class="cursor"></span></div>
          </div>
        </div>`;
        return;
      }
      if (key === "E") {
        stage.innerHTML = `<div class="hero hero-brutal">
          <div class="top"><h1>${NAME.replace(" ", "<br/>")}</h1><span class="stamp"><span class="years">+15</span>Years of exp.</span></div>
          <div class="mid">&gt; ${text}<span class="cursor" style="background:#000;display:inline-block;width:8px;height:1em;vertical-align:text-bottom;animation:blink 1.1s step-end infinite"></span></div>
          <p class="tag">${TAGLINE.toUpperCase()}</p>
        </div>`;
      }
    }

    function getVariant() {
      const p = new URLSearchParams(location.search).get("variant") || "A";
      return VARIANTS.some(v => v.key === p) ? p : "A";
    }

    function setVariant(key) {
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history.replaceState(null, "", url);
      updateUI();
    }

    function cycle(delta) {
      const keys = VARIANTS.map(v => v.key);
      const i = keys.indexOf(getVariant());
      const next = keys[(i + delta + keys.length) % keys.length];
      setVariant(next);
    }

    function updateUI() {
      const key = getVariant();
      const v = VARIANTS.find(x => x.key === key);
      document.getElementById("switcher-label").textContent = `${key} (${v.name})`;
      document.getElementById("state").textContent = JSON.stringify({
        variant: key,
        variantName: v.name,
        typing: { phrase: PHRASES[phraseIndex], visible: currentText(), deleting },
      }, null, 2);
    }

    document.getElementById("prev").addEventListener("click", () => cycle(-1));
    document.getElementById("next").addEventListener("click", () => cycle(1));
    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, textarea, [contenteditable=true]")) return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });

    let t = 0;
    setInterval(() => {
      tickTypewriter();
      t += 1/15;
      renderVariant(getVariant(), t);
      updateUI();
    }, 1000 / 15);

    renderVariant(getVariant(), 0);
    updateUI();
  </script>
</body>
</html>
